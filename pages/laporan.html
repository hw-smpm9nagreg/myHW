<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>myHW - Laporan</title>
<link rel="icon" href="https://lh3.googleusercontent.com/d/1csvYSWImSM_A8khBCr8K1ovcKW8wCuaw" />
<link rel="manifest" href="../manifest.json" />
<meta name="theme-color" content="#0F766E" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="pb-10" style="background: var(--color-bg);">

  <header class="gradient-primary px-4 pt-6 pb-8 flex items-center gap-3" style="border-bottom-left-radius: var(--radius-lg); border-bottom-right-radius: var(--radius-lg);">
    <a href="../dashboard.html" class="w-9 h-9 rounded-full bg-white/15 flex items-center justify-center text-white">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
    <div>
      <h1 class="text-white font-bold text-lg">Laporan</h1>
      <p class="text-teal-50/80 text-xs">Rekap &amp; export data per modul</p>
    </div>
  </header>

  <main class="px-4 -mt-4">
    <div class="card-soft p-3 flex items-center gap-2">
      <div class="flex-1">
        <label class="block text-[10px] text-slate-400 font-semibold uppercase mb-1">Dari Tanggal</label>
        <input type="date" id="filterMulai" class="input-soft w-full px-3 py-2 text-sm" />
      </div>
      <div class="flex-1">
        <label class="block text-[10px] text-slate-400 font-semibold uppercase mb-1">Sampai Tanggal</label>
        <input type="date" id="filterAkhir" class="input-soft w-full px-3 py-2 text-sm" />
      </div>
    </div>
    <p class="text-[11px] text-slate-400 mt-2 px-1">Rentang tanggal berlaku untuk laporan Kegiatan, Absensi, Keuangan &amp; Prestasi. Kosongkan untuk mengambil semua data.</p>

    <div id="reportList" class="mt-4 space-y-3"></div>
  </main>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/pages/laporan.js"></script>
  <script>window.PWA_SW_PATH = "../sw.js"; window.PWA_SCOPE = "../";</script>
  <script src="../assets/js/pwa.js"></script>
</body>
</html>
