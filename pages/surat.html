<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>myHW - Surat</title>
<link rel="icon" href="https://lh3.googleusercontent.com/d/1csvYSWImSM_A8khBCr8K1ovcKW8wCuaw" />
<link rel="manifest" href="../manifest.json" />
<meta name="theme-color" content="#0F766E" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="pb-10" style="background: var(--color-bg);">

  <header class="gradient-primary px-4 pt-6 pb-8 flex items-center gap-3" style="border-bottom-left-radius: var(--radius-lg); border-bottom-right-radius: var(--radius-lg);">
    <a href="../dashboard.html" class="w-9 h-9 rounded-full bg-white/15 flex items-center justify-center text-white">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
    <div>
      <h1 class="text-white font-bold text-lg">Surat</h1>
      <p class="text-teal-50/80 text-xs">Surat masuk &amp; keluar dengan nomor otomatis</p>
    </div>
  </header>

  <main class="px-4 -mt-4">

    <!-- ===== Tabs ===== -->
    <div class="card-soft p-1.5 flex gap-1">
      <button id="tabMasuk" class="tab-btn flex-1 py-2.5 rounded-[var(--radius-sm)] text-sm font-semibold">Surat Masuk</button>
      <button id="tabKeluar" class="tab-btn flex-1 py-2.5 rounded-[var(--radius-sm)] text-sm font-semibold">Surat Keluar</button>
    </div>

    <div id="suratList" class="mt-4 space-y-3"></div>
  </main>

  <button id="btnAdd" class="fab-scan fixed bottom-6 right-5 w-14 h-14 rounded-full flex items-center justify-center text-white text-2xl shadow-lg">
    <i class="fa-solid fa-plus"></i>
  </button>

  <!-- ===== Form Modal ===== -->
  <div id="formModal" class="hidden fixed inset-0 bg-black/40 z-40 flex items-end sm:items-center justify-center">
    <div class="bg-white w-full sm:max-w-lg rounded-t-[var(--radius-lg)] sm:rounded-[var(--radius-lg)] max-h-[92vh] overflow-y-auto p-5">
      <div class="flex items-center justify-between mb-4">
        <h2 id="formTitle" class="font-bold text-lg text-slate-800">Tambah Surat Masuk</h2>
        <button id="btnCloseForm" class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-500"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <p class="text-xs text-slate-400 mb-3">Nomor surat dibuat otomatis oleh sistem saat disimpan.</p>
      <form id="suratForm" class="space-y-3 text-sm">
        <div>
          <label id="labelTujuanAsal" class="block text-xs font-semibold text-slate-600 mb-1">Asal Surat</label>
          <input id="f_tujuanAsal" class="input-soft w-full px-3 py-2.5" required />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Perihal</label>
          <input id="f_perihal" class="input-soft w-full px-3 py-2.5" required />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal</label>
          <input type="date" id="f_tanggal" class="input-soft w-full px-3 py-2.5" required />
        </div>

        <!-- Khusus surat keluar -->
        <div id="keluarFields" class="hidden space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Template</label>
            <select id="f_template" class="input-soft w-full px-3 py-2.5">
              <option value="Surat Undangan">Surat Undangan</option>
              <option value="Surat Tugas">Surat Tugas</option>
              <option value="Surat Keterangan">Surat Keterangan</option>
              <option value="Lainnya">Lainnya</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Isi Surat</label>
            <textarea id="f_isi" rows="5" class="input-soft w-full px-3 py-2.5" placeholder="Tuliskan isi surat lengkap..."></textarea>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Penandatangan</label>
            <input id="f_penandatangan" class="input-soft w-full px-3 py-2.5" placeholder="Contoh: Pembina Qobilah" />
          </div>
          <label class="flex items-center gap-2 text-xs text-slate-600">
            <input type="checkbox" id="f_generatePdf" checked class="rounded border-slate-300 text-teal-700" />
            Buat file PDF otomatis dari isi surat di atas
          </label>
        </div>

        <div id="uploadManualField">
          <label class="block text-xs font-semibold text-slate-600 mb-1">Upload File (opsional / scan surat)</label>
          <input type="file" id="f_file" accept="image/*,.pdf" class="text-xs w-full" />
        </div>

        <button type="submit" class="btn-primary w-full py-3 mt-2">Simpan Surat</button>
      </form>
    </div>
  </div>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/pages/surat.js"></script>
  <script>window.PWA_SW_PATH = "../sw.js"; window.PWA_SCOPE = "../";</script>
  <script src="../assets/js/pwa.js"></script>
</body>
</html>
