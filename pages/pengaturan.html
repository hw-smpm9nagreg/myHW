<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>myHW - Pengaturan</title>
<link rel="icon" href="https://lh3.googleusercontent.com/d/1csvYSWImSM_A8khBCr8K1ovcKW8wCuaw" />
<link rel="manifest" href="../manifest.json" />
<meta name="theme-color" content="#0F766E" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="pb-10" style="background: var(--color-bg);">

  <header class="gradient-primary px-4 pt-6 pb-8 flex items-center gap-3" style="border-bottom-left-radius: var(--radius-lg); border-bottom-right-radius: var(--radius-lg);">
    <a href="../dashboard.html" class="w-9 h-9 rounded-full bg-white/15 flex items-center justify-center text-white">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
    <div>
      <h1 class="text-white font-bold text-lg">Pengaturan</h1>
      <p class="text-teal-50/80 text-xs">Preferensi aplikasi &amp; organisasi</p>
    </div>
  </header>

  <main class="px-4 -mt-4 space-y-4">

    <!-- ===== Preferensi ===== -->
    <div class="card-soft p-1">
      <p class="text-xs font-semibold text-slate-400 uppercase px-4 pt-3 pb-1">Preferensi</p>
      <div class="flex items-center gap-3 p-4">
        <div class="menu-icon bg-amber-50 text-amber-500 w-10 h-10 text-base"><i class="fa-solid fa-moon"></i></div>
        <span class="flex-1 text-sm font-medium text-slate-700">Mode Gelap</span>
        <label class="relative inline-flex items-center cursor-pointer">
          <input type="checkbox" id="darkModeToggle" class="sr-only peer" />
          <div class="w-10 h-6 bg-slate-200 rounded-full peer peer-checked:bg-primary transition"></div>
          <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition peer-checked:translate-x-4"></div>
        </label>
      </div>
    </div>

    <!-- ===== Informasi Organisasi (khusus admin/pembina) ===== -->
    <div id="orgSection" class="hidden card-soft p-4">
      <p class="text-xs font-semibold text-slate-400 uppercase mb-3">Informasi Organisasi</p>
      <form id="orgForm" class="space-y-3 text-sm">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Organisasi / Sekolah</label>
          <input id="s_namaOrganisasi" class="input-soft w-full px-3 py-2.5" placeholder="Contoh: SMP Muhammadiyah 9 Nagreg" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Subjudul</label>
          <input id="s_subjudulOrganisasi" class="input-soft w-full px-3 py-2.5" placeholder="Contoh: Kepanduan Hizbul Wathan" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Alamat Sekretariat</label>
          <textarea id="s_alamatSekretariat" rows="2" class="input-soft w-full px-3 py-2.5"></textarea>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Kontak</label>
          <input id="s_kontakOrganisasi" class="input-soft w-full px-3 py-2.5" placeholder="No HP / email sekretariat" />
        </div>
        <p class="text-[11px] text-slate-400">Nama organisasi ini otomatis dipakai sebagai kop surat saat generate PDF Surat Keluar.</p>
        <button type="submit" class="btn-primary w-full py-3 mt-1">Simpan Perubahan</button>
      </form>
    </div>

    <!-- ===== Cache & PWA ===== -->
    <div class="card-soft p-1">
      <p class="text-xs font-semibold text-slate-400 uppercase px-4 pt-3 pb-1">Aplikasi</p>
      <button id="btnRefreshCache" class="w-full flex items-center gap-3 p-4 text-left">
        <div class="menu-icon bg-sky-50 text-sky-500 w-10 h-10 text-base"><i class="fa-solid fa-rotate"></i></div>
        <span class="flex-1 text-sm font-medium text-slate-700">Segarkan Cache Aplikasi</span>
        <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
      </button>
      <a href="profil.html" class="w-full flex items-center gap-3 p-4 text-left border-t border-slate-100">
        <div class="menu-icon bg-teal-50 text-primary w-10 h-10 text-base"><i class="fa-solid fa-user"></i></div>
        <span class="flex-1 text-sm font-medium text-slate-700">Profil Saya</span>
        <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
      </a>
    </div>

    <!-- ===== Tentang ===== -->
    <div class="card-soft p-4 text-center">
      <img src="https://lh3.googleusercontent.com/d/1csvYSWImSM_A8khBCr8K1ovcKW8wCuaw" class="w-12 h-12 mx-auto rounded-2xl bg-teal-50 p-1.5" alt="myHW" />
      <p class="font-bold text-slate-700 text-sm mt-2">myHW - My Hizbul Wathan</p>
      <p class="text-xs text-slate-400">Sistem Administrasi Digital Kepanduan Hizbul Wathan</p>
      <p class="text-[11px] text-slate-300 mt-2">© <span id="year"></span> Hizbul Wathan</p>
    </div>
  </main>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/pages/pengaturan.js"></script>
  <script>window.PWA_SW_PATH = "../sw.js"; window.PWA_SCOPE = "../";</script>
  <script src="../assets/js/pwa.js"></script>
</body>
</html>
