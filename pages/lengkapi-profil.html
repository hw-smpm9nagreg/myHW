<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>myHW - Lengkapi Pendaftaran</title>
<link rel="icon" href="https://lh3.googleusercontent.com/d/1csvYSWImSM_A8khBCr8K1ovcKW8wCuaw" />
<link rel="manifest" href="../manifest.json" />
<meta name="theme-color" content="#0F766E" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body style="background: var(--color-bg);">

  <header class="gradient-primary px-5 pt-8 pb-10 text-center relative" style="border-bottom-left-radius: var(--radius-lg); border-bottom-right-radius: var(--radius-lg);">
    <div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(#fff 1px, transparent 1px); background-size: 16px 16px;"></div>
    <div class="relative">
      <img src="https://lh3.googleusercontent.com/d/1csvYSWImSM_A8khBCr8K1ovcKW8wCuaw" class="w-14 h-14 mx-auto rounded-2xl bg-white p-1.5 shadow mb-3" alt="myHW" />
      <h1 class="text-white font-bold text-lg">Selamat Datang di myHW! 👋</h1>
      <p class="text-teal-50/90 text-xs mt-1">Lengkapi data keanggotaan Anda dulu, sekali saja,<br/>sebelum masuk ke dashboard</p>
    </div>
  </header>

  <main class="px-4 -mt-6 pb-10">
    <div class="card-soft p-5">
      <form id="registrasiForm" class="space-y-3 text-sm">
        <div class="flex items-center gap-3 mb-2">
          <div id="avatarWrap" class="w-14 h-14 rounded-2xl bg-teal-50 flex items-center justify-center text-xl font-bold text-primary overflow-hidden shrink-0">
            <span id="avatarInitial">?</span>
          </div>
          <div class="min-w-0 flex-1">
            <p id="displayEmail" class="text-xs text-slate-400 truncate">-</p>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Lengkap</label>
          <input id="f_nama" class="input-soft w-full px-3 py-2.5" required />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Tempat Lahir</label>
            <input id="f_tempatLahir" class="input-soft w-full px-3 py-2.5" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal Lahir</label>
            <input type="date" id="f_tanggalLahir" class="input-soft w-full px-3 py-2.5" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Alamat</label>
          <textarea id="f_alamat" rows="2" class="input-soft w-full px-3 py-2.5"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">No HP</label>
            <input id="f_noHp" class="input-soft w-full px-3 py-2.5" placeholder="08xxxxxxxxxx" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Jenis Kelamin</label>
            <select id="f_jenisKelamin" class="input-soft w-full px-3 py-2.5">
              <option value="L">Laki-laki</option>
              <option value="P">Perempuan</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Tingkatan</label>
          <select id="f_golongan" class="input-soft w-full px-3 py-2.5">
            <option>Athfal</option>
            <option>Pengenal</option>
            <option>Penghela</option>
            <option>Penuntun</option>
          </select>
        </div>

        <div class="bg-amber-50 border border-amber-100 rounded-[var(--radius-sm)] p-3 flex items-start gap-2">
          <i class="fa-solid fa-circle-info text-amber-500 mt-0.5"></i>
          <p class="text-[11px] text-amber-700">Qobilah, nomor anggota, dan QR Code kartu anggota akan ditetapkan oleh admin/pembina setelah pendaftaran Anda disetujui (ACC).</p>
        </div>

        <button type="submit" class="btn-primary w-full py-3 mt-2">Kirim Pendaftaran</button>
      </form>
    </div>
  </main>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/pages/lengkapi-profil.js"></script>
  <script>window.PWA_SW_PATH = "../sw.js"; window.PWA_SCOPE = "../";</script>
  <script src="../assets/js/pwa.js"></script>
</body>
</html>
